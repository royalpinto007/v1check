<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc"><title id="title">v1check architecture</title><desc id="desc">Local files pass through a bounded reader into AST and dependency rules, then reports. No network or code execution.</desc><rect width="1100" height="290" rx="16" fill="#101113"/><g font-family="system-ui,sans-serif"><text x="36" y="48" font-size="23" fill="#e6e8e9">v1check / offline by design</text><g fill="#1a1c1f" stroke="#454a50"><rect x="36" y="100" width="210" height="92" rx="10"/><rect x="300" y="100" width="210" height="92" rx="10"/><rect x="564" y="100" width="210" height="92" rx="10"/><rect x="828" y="100" width="236" height="92" rx="10"/></g><g fill="#b8f07c" font-size="24"><text x="265" y="153">→</text><text x="529" y="153">→</text><text x="793" y="153">→</text></g><g fill="#e6e8e9" font-size="17"><text x="56" y="140">Local project</text><text x="320" y="140">Bounded reader</text><text x="584" y="140">AST + SDK rules</text><text x="848" y="140">CLI / HTML / exports</text></g><g fill="#a9afb6" font-size="13"><text x="56" y="168">Source + lockfiles</text><text x="320" y="168">Skip secrets and symlinks</text><text x="584" y="168">Dated, sourced findings</text><text x="848" y="168">Runtime support unverified</text><text x="36" y="245">No project code executed. No network calls. Explicit report output only.</text></g></g></svg>
